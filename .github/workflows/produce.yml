name: Produce episode
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "job folder name under jobs/"
        required: true
permissions:
  contents: write
concurrency: produce
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Pick the job
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then echo "slug=${{ github.event.inputs.slug }}" >> $GITHUB_OUTPUT; exit 0; fi
          for d in jobs/*/; do s=$(basename $d); if [ -f "$d/flow_img/DONE" ] && [ ! -f "$d/produced.json" ] && [ "${s:0:1}" != "_" ]; then echo "slug=$s" >> $GITHUB_OUTPUT; exit 0; fi; done
          echo "slug=" >> $GITHUB_OUTPUT
      - name: Tools
        if: steps.pick.outputs.slug != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q numpy pillow opencv-python-headless onnxruntime
      - name: Produce
        if: steps.pick.outputs.slug != ''
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/produce.py jobs/${{ steps.pick.outputs.slug }}
      - name: Save
        if: steps.pick.outputs.slug != ''
        run: |
          git config user.name "firmenfriedhof-robot"
          git config user.email "robot@users.noreply.github.com"
          git add publish jobs/${{ steps.pick.outputs.slug }}/produced.json jobs/${{ steps.pick.outputs.slug }}/render_map.json jobs/${{ steps.pick.outputs.slug }}/voice.mp3 jobs/${{ steps.pick.outputs.slug }}/voice_alignment.json
          git commit -m "Produced ${{ steps.pick.outputs.slug }}" || echo "nothing"
          git pull --rebase && git push
